name: "Setup environment"
description: "Install uv and Python dependencies"
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install Python
      run: uv python install 3.14
      shell: bash

    - name: Install dependencies
      run: uv sync --dev
      shell: bash
