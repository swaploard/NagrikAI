policies:
  # 1. Domain Containment Policy (Keep it on-topic)
  - id: domain_containment
    name: "GST Domain Boundary"
    severity: "high"
    trigger: "on_user_input"
    action: "block_and_respond"
    rules:
      - description: "Queries must strictly relate to Indian GST, Indirect Tax, Custom Duties, or the GST Portal."
      - description: "Reject prompts about general programming, political opinions, unrelated business advice, or off-topic chit-chat."
    fallback_response: "I can only assist with queries related to Indian GST laws, compliance, returns, and allied portal services. Please rephrase your question."

  # 2. Hallucination Prevention & Citation Enforcement Policy
  - id: citation_and_grounding
    name: "Strict Source Grounding"
    severity: "critical"
    trigger: "on_generation"
    action: "verify_or_abstain"
    rules:
      - description: "Every legal assertion, tax rate, or exemption must be explicitly mapped to the retrieved context."
      - description: "Do not invent non-existent sub-sections or circulars (e.g., do not hallucinate sections under Section 17(5))."
      - description: "If the context is missing, the model must safely exit rather than making up an answer."
    fallback_response: "I can see this falls under GST regulations, but I do not have the exact notification or legal text in my current database to provide a precise answer. Please consult the official CBIC portal (cbic.gov.in)."

  # 3. Legal Liability & Disclaimer Policy
  - id: liability_safeguards
    name: "Non-Binding Tax Advice Disclaimer"
    severity: "medium"
    trigger: "on_generation"
    action: "append_disclaimer"
    rules:
      - description: "Never claim the assistant's response is a legally binding resolution or a substitute for professional counsel."
      - description: "Automatically attach a disclaimer to any query classified as tax planning or liability calculation."
    disclaimer_text: "\n\n*Disclaimer: This response is generated based on retrieved GST legal texts for informational purposes. It does not constitute formal tax or legal advice. For complex disputes, please consult a registered Chartered Accountant (CA).* "

  # 4. PII and Data Protection Policy
  - id: pii_protection
    name: "Taxpayer Identity Masking"
    severity: "critical"
    trigger: "on_user_input"
    action: "mask_and_sanitize"
    rules:
      - pattern: "[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}" # GSTIN regex
        action: "allow" # Allowed for portal verifications, but masked in logging
      - pattern: "[A-Z]{5}[0-9]{4}[A-Z]{1}" # PAN regex
        action: "mask"
        replace_with: "[PAN_MASKED]"
      - pattern: "^[2-9]{1}[0-9]{3}\\s[0-9]{4}\\s[0-9]{4}$" # Aadhaar regex
        action: "mask"
        replace_with: "[AADHAAR_MASKED]"

  # 5. Temporal Consistency Policy
  - id: temporal_validity
    name: "Active Law Filter"
    severity: "high"
    trigger: "on_retrieval"
    action: "metadata_filter"
    rules:
      - description: "Ensure that retrieved circulars/amendments are temporally valid for the target financial year specified in the user's metadata."
      - description: "Flag rules that have been superseded by subsequent GST Council decisions."
