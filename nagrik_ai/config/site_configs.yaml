sites:
  - name: india_gov
    base_url: https://www.india.gov.in
    start_urls:
      - https://www.india.gov.in/
    allowed_domains:
      - india.gov.in
    crawler:
      max_concurrency: 5
      request_delay: 1.0
      timeout: 30
      max_depth: 1
    parser:
      content_selector: "main"
      strip_selectors:
        - nav
        - footer
        - script
        - style

  - name: gst
    base_url: https://www.gst.gov.in
    start_urls:
      - https://www.gst.gov.in/
    allowed_domains:
      - gst.gov.in
    crawler:
      max_concurrency: 5
      request_delay: 1.0
      timeout: 30
      max_depth: 1
    parser:
      content_selector: "main"
      strip_selectors:
        - nav
        - footer
        - script
        - style

chroma_persist_dir: chroma_db
content_dir: content
embedding_model: all-MiniLM-L6-v2
ollama_base_url: http://localhost:11434
ollama_model: llama3.2
