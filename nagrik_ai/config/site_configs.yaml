sites:
  - name: migri
    base_url: https://migri.fi
    start_urls:
      - https://migri.fi/en/residence-permits
      - https://migri.fi/en/citizenship
    allowed_domains:
      - migri.fi
    crawler:
      max_concurrency: 5
      request_delay: 1.0
      timeout: 30
      max_depth: 3
    parser:
      content_selector: "#content"
      strip_selectors:
        - nav
        - footer
        - script
        - style

  - name: kela
    base_url: https://www.kela.fi
    start_urls:
      - https://www.kela.fi/foreigners
      - https://www.kela.fi/benefits
    allowed_domains:
      - kela.fi
    crawler:
      max_concurrency: 5
      request_delay: 1.0
      timeout: 30
      max_depth: 3
    parser:
      content_selector: ".main-content"
      strip_selectors:
        - nav
        - footer
        - script
        - style

  - name: vero
    base_url: https://www.vero.fi
    start_urls:
      - https://www.vero.fi/en/individuals/tax-cards-and-tax-returns/
    allowed_domains:
      - vero.fi
    crawler:
      max_concurrency: 5
      request_delay: 1.0
      timeout: 30
      max_depth: 3
    parser:
      content_selector: "main"
      strip_selectors:
        - nav
        - footer
        - script
        - style

  - name: dvv
    base_url: https://dvv.fi
    start_urls:
      - https://dvv.fi/en/front-page
    allowed_domains:
      - dvv.fi
    crawler:
      max_concurrency: 5
      request_delay: 1.0
      timeout: 30
      max_depth: 3
    parser:
      content_selector: "main"
      strip_selectors:
        - nav
        - footer
        - script
        - style

  - name: te_palvelut
    base_url: https://te-palvelut.fi
    start_urls:
      - https://te-palvelut.fi/en/employment-opportunities
    allowed_domains:
      - te-palvelut.fi
    crawler:
      max_concurrency: 5
      request_delay: 1.0
      timeout: 30
      max_depth: 3
    parser:
      content_selector: "main"
      strip_selectors:
        - nav
        - footer
        - script
        - style

chroma_persist_dir: chroma_db
content_dir: content
embedding_model: all-MiniLM-L6-v2
ollama_base_url: http://localhost:11434
ollama_model: llama3.2
